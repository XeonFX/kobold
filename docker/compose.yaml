# Kobold robot stack.
#
#   Deploy:   scripts/deploy.sh <sha>     (never `docker compose up` by hand
#                                          in production — you skip the gates)
#   Rollback: scripts/rollback.sh
#
# Images are referenced by DIGEST via docker/versions.env, written by CI. Tags
# move; digests do not. "What is running on the robot?" must have exactly one
# answer, and that answer is a git SHA.
#
# ---------------------------------------------------------------------------
# network_mode: host everywhere
# ---------------------------------------------------------------------------
# ROS 2 DDS discovery across bridged Docker networks is a long-running source of
# misery. Host networking sidesteps it entirely. The trade: containers are NOT
# network-isolated. That is acceptable — what we want here is dependency
# isolation and versioned rollback, not a security boundary.

name: kobold

x-common: &common
  restart: unless-stopped
  network_mode: host
  environment: &common-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    KOBOLD_SHA: "${KOBOLD_SHA:-dev}"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ---------------------------------------------------------------- base ----
  # URDF, TF tree, and the EKF that fuses wheel odometry with gyro yaw.
  # Everything else assumes this is running.
  base:
    <<: *common
    image: ${IMAGE_BASE:-ghcr.io/xeonfx/kobold-ros:dev}
    container_name: kobold-base
    command: ros2 launch kobold_bringup base.launch.py
    volumes:
      - ../ros2_ws/src/kobold_bringup/config:/config:ro
      - /data/maps:/data/maps
    cpuset: "0,1,2,3"          # A55 cluster — see note above the A76 services

  # -------------------------------------------------------------- bridge ----
  # The only container that touches the microcontrollers. Refuses to send a
  # motor command if the firmware protocol version disagrees with this build.
  bridge:
    <<: *common
    image: ${IMAGE_BASE:-ghcr.io/xeonfx/kobold-ros:dev}
    container_name: kobold-bridge
    command: ros2 run kobold_bridge bridge --ros-args --params-file /config/bridge.yaml
    depends_on: [base]
    volumes:
      - ../ros2_ws/src/kobold_bringup/config:/config:ro
    devices:
      # udev-named, never ttyUSB0 — enumeration order changes between reboots
      # and the failure mode is motor commands going to the ultrasonic board.
      - /dev/robot-drive:/dev/robot-drive
      - /dev/robot-sense:/dev/robot-sense
    group_add: ["dialout"]
    cpuset: "0,1,2,3"

  # ----------------------------------------------------------------- nav ----
  nav:
    <<: *common
    image: ${IMAGE_NAV:-ghcr.io/xeonfx/kobold-nav:dev}
    container_name: kobold-nav
    command: ros2 launch kobold_bringup nav.launch.py
    depends_on: [base, bridge]
    volumes:
      - ../ros2_ws/src/kobold_bringup/config:/config:ro
      - /data/maps:/data/maps
    # Nav2 is the heaviest unpinned consumer and would otherwise land on the
    # A76s mid-replan, stealing exactly the cycles ASR has no margin for.
    # If planning proves too slow here, take a core from the LLM, not voice.
    cpuset: "0,1,2,3"
    profiles: [nav]          # Phase 5 — not started until the lidar arrives

  # -------------------------------------------------------------- camera ----
  camera:
    <<: *common
    image: ${IMAGE_PERCEPTION:-ghcr.io/xeonfx/kobold-perception:dev}
    container_name: kobold-camera
    command: ros2 launch kobold_perception camera.launch.py
    devices:
      # ISP mainpath, not /dev/video0 (that is the raw CIF endpoint).
      - /dev/video11:/dev/video11
      # IMX219 controls: exposure, gain, and orientation.
      - /dev/v4l-subdev2:/dev/v4l-subdev2
      - /dev/dri:/dev/dri      # hardware H.264 encode via rkmpp
      # 2D accelerator. Without it the node silently falls back to CPU colour
      # conversion, which measured 32% of an A55 against RGA's ~1%.
      - /dev/rga:/dev/rga
      # VPU. Hardware JPEG/H.264 encode for the video stream — 3.0% and 1.5%
      # of a core respectively, against 6.8% and 70.4% in software.
      - /dev/mpp_service:/dev/mpp_service
    group_add: ["video", "render"]
    cpuset: "0,1,2,3"
    profiles: [perception]

  # ---------------------------------------------------------- perception ----
  # YOLO + SigLIP + monocular depth. RKNN vision is pinned to NPU core 0.
  # The selected RKLLM artifact is compiled for all three cores, so concurrent
  # generation still contends with vision; measured concurrent throughput stays
  # usable at 47.8 detector FPS and 7.96 LLM tokens/s.
  perception:
    <<: *common
    image: ${IMAGE_PERCEPTION:-ghcr.io/xeonfx/kobold-perception:dev}
    container_name: kobold-perception
    command: ros2 launch kobold_perception perception.launch.py
    depends_on: [base]
    # RKNNLite identifies the SoC through /proc/device-tree, which resolves
    # into /sys/firmware. Docker masks /sys/firmware by default; ordinary bind
    # mounts are applied before that mask and disappear. Unmask system paths
    # without granting the much broader --privileged capability set.
    security_opt:
      - systempaths=unconfined
    environment:
      <<: *common-env
      RKNN_CORE_MASK: "1"
    volumes:
      - /data/models:/models:ro
      - /data/targets:/data/targets
    devices:
      - /dev/dri:/dev/dri
      - /dev/rga:/dev/rga       # letterbox on the 2D accelerator, not the CPU
    group_add: ["render", "video"]
    # Reserve one A76 for capture/pre/post-processing. The raw C++ path sustains
    # ~58 FPS here while voice uses the other three A76s.
    cpuset: "4"
    profiles: [perception]

  # ----------------------------------------------------------------- llm ----
  # Native C++ OpenAI-compatible endpoint using the validated Qwen3.5-2B /
  # RKLLM 1.3.0 chain. The paired vision encoder is pinned in the manifest;
  # this HTTP endpoint currently serves text chat/tool requests.
  llm:
    <<: *common
    image: ${IMAGE_LLM:-ghcr.io/xeonfx/kobold-llm:dev}
    container_name: kobold-llm
    environment:
      <<: *common-env
      # Core allocation is embedded in an RKLLM model. This artifact reports
      # npu_core_num=3; RKNN_CORE_MASK does not constrain it.
      MODEL_PATH: /models/qwen3.5-2b_w8a8_rk3588.rkllm
      MODEL_NAME: qwen3.5-2b-rk3588
      MAX_CONTEXT: "4096"          # the KV cache is what eats RAM, not the weights
      MAX_NEW_TOKENS: "512"
      API_KEY: "${LLM_API_KEY:-}"  # optional; set in the gitignored .env
    volumes:
      - /data/models:/models:ro
    devices:
      - /dev/dri:/dev/dri
    group_add: ["render"]
    # Was "4,5,6,7", which silently took every A76 and contradicted the
    # partition both neighbouring services describe. Measured 2026-08-04, LLM
    # generating continuously while ASR transcribes a 29.3 s clip:
    #
    #   llm 4,5,6,7   ASR 2.20x real time   LLM 8.59 tok/s
    #   llm 4,5       ASR 2.62x real time   LLM 8.38 tok/s
    #
    # 19% more ASR headroom for 2.4% less generation. cpu_shares was tried and
    # rejected: 1024 is the default so it changes nothing, and 256 starved the
    # LLM to a single completion per window.
    cpuset: "4,5"
    profiles: [ai]

  # --------------------------------------------------------------- voice ----
  # Three A76s: measured ASR is ~1.1x real time here versus 3.6x slower than
  # real time on all four A55s. Core 4 stays with perception, and the LLM is
  # held to 4-5 so these three are contended by at most one other NPU consumer.
  # 1.1x is only 10% of headroom -- if this ever drops under 1.0x under load,
  # move to tiny.en (~3x faster, real accuracy cost) rather than hoping.
  voice:
    <<: *common
    image: ${IMAGE_VOICE:-ghcr.io/xeonfx/kobold-voice:dev}
    container_name: kobold-voice
    environment:
      <<: *common-env
      ASR_MODEL: /models/ggml-base.en-q5_1.bin
      TTS_VOICE: /models/en_US-amy-medium.onnx
    volumes:
      - /data/models:/models:ro
    cpuset: "5,6,7"
    profiles: [ai]

  # --------------------------------------------------------------- agent ----
  agent:
    <<: *common
    image: ${IMAGE_AGENT:-ghcr.io/xeonfx/kobold-agent:dev}
    container_name: kobold-agent
    environment:
      <<: *common-env
      # Point this at the Odroid or a cloud model when you want a bigger brain;
      # the robot falls back to the local 2B when offline.
      LLM_BASE_URL: "${LLM_BASE_URL:-http://localhost:8080/v1}"
    env_file:
      - path: ../.env          # API keys — gitignored, never leaves the robot
        required: false
    volumes:
      - ../agent/hermes:/config:ro
      - /data/agent:/data/agent
    depends_on: [llm]
    profiles: [ai]

  # ----------------------------------------------------------------- app ----
  # Static files are BIND-MOUNTED from the git checkout, not baked into the
  # image. UI changes deploy with `git checkout` and a browser refresh — no
  # rebuild, no pull. That is the payoff for having no build step.
  app:
    <<: *common
    image: ${IMAGE_APP:-ghcr.io/xeonfx/kobold-app:dev}
    container_name: kobold-app
    volumes:
      - ../app/static:/app/static:ro
      - /data/targets:/data/targets
      - /data/deploy:/data/deploy:ro     # so the UI can show the running SHA
      - /var/run/docker.sock:/var/run/docker.sock:ro   # deploy status only
    environment:
      <<: *common-env
      PORT: "8000"

  # ------------------------------------------------------------- foxglove ----
  foxglove:
    <<: *common
    image: ${IMAGE_BASE:-ghcr.io/xeonfx/kobold-ros:dev}
    container_name: kobold-foxglove
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
    depends_on: [base]
    profiles: [debug]

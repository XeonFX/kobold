; Kobold firmware — three ESP32 DevKit V1 boards, one project.
;
;   pio run -e drive              build
;   pio run -e drive -t upload    build + flash
;   pio device monitor            watch the framed link (binary — use the bridge)
;   pio test -e native            run host-side protocol tests
;
; Board config lives here, in git, rather than in an IDE dropdown — three
; boards with different pin maps and different sources make that the difference
; between reproducible builds and guesswork.

[platformio]
default_envs = drive, sense
src_dir = src
lib_dir = lib

[env]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
upload_speed = 921600

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; Firmware version, reported in the `version` message and checked by the
    ; bridge against models/manifest.yaml before it sends a motor command.
    -D FW_VERSION_MAJOR=0
    -D FW_VERSION_MINOR=1
    -D FW_VERSION_PATCH=0
    !python3 ../tools/git_hash_flag.py

; Pin library versions. An unpinned library that silently updates is the same
; class of problem as an unpinned container image.
lib_deps =
    olikraus/U8g2@^2.35.30

check_tool = cppcheck
check_flags = --enable=warning,style --inline-suppr

; ---------------------------------------------------------------- drive ----
; Motors, encoders, IMU, battery, cliff reflex. The USB-C board — its distinct
; USB-serial VID/PID makes the udev rule unambiguous.
[env:drive]
build_src_filter = +<drive/>
upload_port = /dev/robot-drive
monitor_port = /dev/robot-drive
build_flags =
    ${env.build_flags}
    -D KOBOLD_BOARD_DRIVE

; ---------------------------------------------------------------- sense ----
; Ultrasonic ranging, horizontal IR, buzzer, OLED, hardware safety line.
[env:sense]
build_src_filter = +<sense/>
upload_port = /dev/robot-sense
monitor_port = /dev/robot-sense
build_flags =
    ${env.build_flags}
    -D KOBOLD_BOARD_SENSE

; ----------------------------------------------------------------- head ----
; Pan/tilt servos, PIR, second OLED. Not populated until Phase 5 — until then
; this board is the spare.
[env:head]
build_src_filter = +<head/>
build_flags =
    ${env.build_flags}
    -D KOBOLD_BOARD_HEAD
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo@^3.0.5

; ---------------------------------------------------------------- native ----
; Host-side unit tests for the framing codec: COBS, CRC16, and the resync
; behaviour. Runs on your Mac, no hardware required.
[env:native]
platform = native
build_src_filter = +<../test/native/>
build_flags = -std=c++17 -I lib/kobold_protocol -D KOBOLD_NATIVE_TEST
test_framework = unity

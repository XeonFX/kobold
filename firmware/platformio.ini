; Kobold firmware — three ESP32 DevKit V1 boards plus a host-side test target.
;
;   pio run -e drive              build
;   pio run -e drive -t upload    build + flash
;   pio test -e native            run codec tests on your machine
;
; Board config lives here, in git, rather than in an IDE dropdown — three boards
; with different pin maps and different sources make that the difference between
; reproducible builds and guesswork.
;
; NOTE ON STRUCTURE: the ESP32 settings live in [esp32] and are pulled in with
; `extends`, NOT in a global [env] section. PlatformIO applies [env] to EVERY
; environment including `native`, which then inherited `board =
; esp32doit-devkit-v1` and failed with "Unknown board ID". [env] must only hold
; settings that are genuinely true for every target.

[platformio]
default_envs = drive, sense
src_dir = src
lib_dir = lib

; ------------------------------------------------------- shared ESP32 config --
[esp32]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_unflags = -std=gnu++11

build_flags =
    ; Headers use C++17 inline variables for shared ISR state. Relying on the
    ; toolchain's C++11 compatibility extension emits warnings today and can
    ; become a hard error after a platform update.
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; Required because the ISRs are IRAM_ATTR functions defined inline in
    ; headers (encoders.h, cliff.h, ultrasonic.h). Without this the Xtensa
    ; linker fails with "dangerous relocation: l32r: literal placed after use"
    ; — it cannot reach the literal pool from a custom section.
    -mtext-section-literals
    ; Firmware version, reported in the `version` message and checked by the
    ; bridge against models/manifest.yaml before it sends a motor command.
    -D FW_VERSION_MAJOR=0
    -D FW_VERSION_MINOR=1
    -D FW_VERSION_PATCH=0
    !python3 ../tools/git_hash_flag.py

; Pin library versions. An unpinned library that silently updates is the same
; class of problem as an unpinned container image.
lib_deps =
    olikraus/U8g2@^2.35.30

; ---------------------------------------------------------------- drive ----
; Motors, encoders, IMU, battery, cliff reflex. The USB-C board — its distinct
; USB-serial VID/PID makes the udev rule unambiguous.
[env:drive]
extends = esp32
build_src_filter = +<drive/>
upload_port = /dev/robot-drive
monitor_port = /dev/robot-drive
build_flags =
    ${esp32.build_flags}
    -D KOBOLD_BOARD_DRIVE

; ---------------------------------------------------------------- sense ----
; Ultrasonic ranging, horizontal IR, buzzer, OLED, hardware safety line.
[env:sense]
extends = esp32
build_src_filter = +<sense/>
upload_port = /dev/robot-sense
monitor_port = /dev/robot-sense
build_flags =
    ${esp32.build_flags}
    -D KOBOLD_BOARD_SENSE

; ----------------------------------------------------------------- head ----
; Pan/tilt servos, PIR, second OLED. Not populated until Phase 5 — until then
; this board is the spare.
[env:head]
extends = esp32
build_src_filter = +<head/>
build_flags =
    ${esp32.build_flags}
    -D KOBOLD_BOARD_HEAD
lib_deps =
    ${esp32.lib_deps}
    madhephaestus/ESP32Servo@^3.0.5

; ---------------------------------------------------------------- native ----
; Host-side tests for the framing codec: COBS, CRC16, frame parsing, corruption
; detection, and the cross-language vectors shared with the Python bridge.
; Runs on your laptop and in CI — no ESP32 required.
;
; lib_ignore is what makes this work: kobold_link includes Arduino.h and cannot
; compile natively. Keeping the pure codec in its own library (kobold_codec) is
; what allows the wire format to be tested off-target at all.
[env:native]
platform = native
test_framework = unity
; `pio test` does not build src/ by default (test_build_src=false), so no
; build_src_filter is needed — and setting one here broke test discovery.
lib_ignore = kobold_link
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D KOBOLD_NATIVE_TEST

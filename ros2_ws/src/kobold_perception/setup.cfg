# Without this, setuptools installs console_scripts into <prefix>/bin, but
# `ros2 run` and `ros2 pkg executables` only look in <prefix>/lib/<package>.
# The package then builds cleanly, installs, and is invisible to the tooling.
[develop]
script_dir=$base/lib/kobold_perception
[install]
install_scripts=$base/lib/kobold_perception

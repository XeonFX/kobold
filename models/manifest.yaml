# Model manifest — the single source of truth for what runs on the NPU.
#
#   make fetch-models     download + verify into /data/models
#   make check-models      verify checksums of what is already there
#
# Models are NEVER committed to git and never baked into images. They are large,
# they change on a different cadence from code, and burying a 2.7 GB blob in git
# history is permanent. Swapping a model is a config change, not a deploy.
#
# ---------------------------------------------------------------------------
# THE VERSION CHAIN — the thing that will actually bite you
# ---------------------------------------------------------------------------
# Three versions must agree, and only one of them lives in a container you
# control. Containers assert these at startup so a mismatch is the first line in
# the log rather than a baffling inference failure two hours later.
#
#   .rkllm file  <->  librkllmrt.so in the container  <->  rknpu kernel driver
#
# Values below are VERIFIED on the robot (2026-08-03, ROCK 5B):
#   rknpu driver : v0.9.8   (sudo cat /sys/kernel/debug/rknpu/version)
#   librknnrt    : 2.3.0    (/usr/lib/aarch64-linux-gnu/librknnrt.so.2.3.0)
#   rknpu2 pkg   : 2.3.0-1
#
# v0.9.8 is the newest RKNPU driver that exists, and RKLLM requires >= 0.9.6,
# so the driver is not a constraint. What constrains you is that the runtime
# must match the file — and most published .rkllm files target older runtimes.

host_requirements:
  rknpu_driver: "0.9.8"
  librknnrt: "2.3.0"

models:

  # --------------------------------------------------------------- language --
  # Language decoder and vision encoder are one atomic RKLLM 1.3.0 release.
  # Both files and the runtime were exercised together on the Rock 5B; never
  # upgrade only one member of this version chain.
  llm:
    name: qwen3.5-2b
    version: w8a8-rk3588-rkllm1.3.0
    file: qwen3.5-2b_w8a8_rk3588.rkllm
    url: https://huggingface.co/Qengineering/Qwen3.5-2B-rk3588/resolve/52d292f0dfaa22bcbf9048193e7e0e3ce3fa3309/qwen3.5-2b_w8a8_rk3588.rkllm
    sha256: 3185384ce7b13805b15f93848d2cec549f6f2e97a0b4b623398cb5835bf62172
    size_mb: 2842
    rkllm_runtime: "1.3.0"
    extra_files:
      - file: qwen3.5-2b_vision_rk3588.rknn
        sha256: 1976b3f70d776b452fb41e905d20535bccfa0d70baa279204a1b55b32485f5dc
    notes: >
      Multimodal slow path. Cap context at 4096 on the 8 GB board. Measured
      text generation was 10.44 tok/s at 2216 MB peak; the paired vision path
      was 11.71 tok/s after a 2.10 s prefill at 3165 MB peak. RKLLM uses all
      three NPU cores; YOLO remains the independent reactive perception path.

  # ------------------------------------------------------------------ vision --
  detector:
    name: yolo11n
    version: rknn2.3.0
    file: yolo11n.rknn
    url: ""
    sha256: ""
    size_mb: 12
    rknn_runtime: "2.3.0"
    notes: >
      COCO 80 classes, which includes `cat` (class 15). This is the cat game's
      real-time tracker and the region proposer for photo search. 20-30 Hz.

  embedder:
    name: siglip-base-patch16
    version: rknn2.3.0
    file: siglip_image_encoder.rknn
    url: ""
    sha256: ""
    size_mb: 200
    rknn_runtime: "2.3.0"
    notes: >
      Image encoder only, no text tower. Cosine similarity between your uploaded
      reference photo and YOLO crops. This is what finds a SPECIFIC mug rather
      than any mug — the 80 fixed COCO classes cannot do that.

  depth:
    name: depth-anything-v2-small
    version: rknn2.3.0
    file: depth_anything_v2_vits.rknn
    url: ""
    sha256: ""
    size_mb: 100
    rknn_runtime: "2.3.0"
    notes: >
      Relative monocular depth, scaled by wheel odometry, projected into the Nav2
      costmap. Catches table tops and chair seats that a 2D lidar plane misses.
      Replaced the stereo plan — the ROCK 5B has one CSI connector, not two.

  # ------------------------------------------------------------------- voice --
  # English-only. Polish fine-tunes are f16-only (q5 wrecks Polish transcription)
  # and cost ~500 MB instead of ~60 MB. If you add Polish later, revisit the RAM
  # budget in docs/PROJECT_PLAN.md section 7.1 first.
  asr:
    name: whisper-base.en
    version: ggml-q5_1
    file: ggml-base.en-q5_1.bin
    url: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en-q5_1.bin
    sha256: 4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f
    size_mb: 60
    notes: >
      CPU only, pinned to A76 cores 5-7. Re-measured 2026-08-04 on a 29.3 s
      Piper-synthesised clip, 3 threads, whisper default 5-beam decode:
      3.05x real time idle, 2.62x with the LLM generating concurrently. An
      earlier note here said 1.1x; that figure could not be reproduced and
      should not be trusted for capacity planning. Clean synthesised speech in
      a single 30 s window is the easy case, so treat 2.6x as an upper bound
      until measured against real microphone audio and streaming utterances.

  tts:
    name: piper-en_US-amy-medium
    version: "1.0"
    file: en_US-amy-medium.onnx
    url: https://huggingface.co/rhasspy/piper-voices/resolve/9f967d15e9ccdf43078586d1476ee70f314401bd/en/en_US/amy/medium/en_US-amy-medium.onnx
    sha256: b3a6e47b57b8c7fbe6a0ce2518161a50f59a9cdd8a50835c02cb02bdd6206c18
    size_mb: 63
    extra_files:
      - file: en_US-amy-medium.onnx.json
        sha256: 95a23eb4d42909d38df73bb9ac7f45f597dbfcde2d1bf9526fdeaf5466977d77

  vad:
    name: silero-vad
    version: "5.1.2"
    file: silero_vad.onnx
    url: https://github.com/snakers4/silero-vad/raw/v5.1.2/src/silero_vad/data/silero_vad.onnx
    sha256: 2623a2953f6ff3d2c1e61740c6cdb7168133479b267dfef114a4a3cc5bdd788f
    size_mb: 2
